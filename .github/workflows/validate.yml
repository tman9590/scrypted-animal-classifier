name: Validate animal classifier

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch==2.8.0 torchvision==0.23.0 onnx==1.19.1 onnxruntime==1.23.2
      - run: python -m unittest discover -s tests -v
      - name: Validate ONNX model
        run: |
          python - <<'PY'
          import onnx
          import onnxruntime
          import numpy as np
          path = "models/onnx/animal-mobilenet-v3-small.onnx"
          onnx.checker.check_model(onnx.load(path))
          session = onnxruntime.InferenceSession(path, providers=["CPUExecutionProvider"])
          output = session.run(None, {session.get_inputs()[0].name: np.zeros((1, 3, 224, 224), np.float32)})[0]
          assert output.shape == (1, 28)
          assert np.isfinite(output).all()
          PY
